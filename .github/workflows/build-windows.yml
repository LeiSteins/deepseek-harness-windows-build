name: Build DeepSeek Harness for Windows

on:
  workflow_dispatch:
  schedule:
    # 00:00 Asia/Shanghai (16:00 UTC on the previous calendar day).
    - cron: "0 16 * * *"

permissions:
  contents: write

concurrency:
  group: windows-desktop-release
  cancel-in-progress: false

env:
  DSH_DESKTOP_APP_ID: io.github.leisteins.deepseekharness
  DSH_TELEMETRY_DISABLED: "1"
  # Rolling release that serves the update feed (nightly.yml) plus the installer
  # and blockmap it references. Installed applications have this URL baked in,
  # so the tag must stay stable.
  DSH_WINDOWS_FEED_TAG: windows-feed

jobs:
  resolve-release:
    name: Resolve latest upstream release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      should_build: ${{ steps.release.outputs.should_build }}
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}

    steps:
      - name: Find latest DeepSeek Harness release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_json="$(gh api 'repos/deepseek-ai/deepseek-harness/releases?per_page=100')"
          tag="$(jq -r 'map(select(.draft == false))[0].tag_name // empty' <<< "$release_json")"
          title="$(jq -r 'map(select(.draft == false))[0].name // empty' <<< "$release_json")"
          prerelease="$(jq -r 'map(select(.draft == false))[0].prerelease' <<< "$release_json")"

          if [[ -z "$tag" ]]; then
            echo "No published upstream release was found." >&2
            exit 1
          fi
          if [[ -z "$title" ]]; then
            title="$tag"
          fi

          release_complete=false
          if local_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null)"; then
            if jq -e '.assets | any(.name; test("^deepseek-harness-.+-win-x64(-unsigned)?\\.exe$"))' \
              <<< "$local_release" >/dev/null; then
              release_complete=true
            fi
          fi

          should_build=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$release_complete" == "false" ]]; then
            should_build=true
          fi

          {
            echo "tag=$tag"
            echo "title=$title"
            echo "prerelease=$prerelease"
            echo "should_build=$should_build"
          } >> "$GITHUB_OUTPUT"

          echo "Latest upstream release: $title ($tag)"
          echo "Matching local release has an installer: $release_complete"
          echo "Build requested: $should_build"

  build:
    name: Windows x64 unsigned installer
    needs: resolve-release
    if: needs.resolve-release.outputs.should_build == 'true'
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        working-directory: 'C:\dsh'

    steps:
      - name: Check out DeepSeek Harness
        uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.resolve-release.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      # Use a physical short path: Node realpath can expand a subst drive back
      # to the original long workspace path before loading native Python modules.
      - name: Prepare short Windows build directory
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if (Test-Path 'C:\dsh') {
            throw "C:\dsh already exists; refusing to overwrite it."
          }
          robocopy "$env:GITHUB_WORKSPACE" 'C:\dsh' /E /SL /XJ /R:2 /W:1 /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8 -or -not (Test-Path 'C:\dsh\package.json')) {
            throw "Failed to copy the checkout to C:\dsh."
          }
          git config --global --add safe.directory C:/dsh
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to register the short checkout path with Git."
          }

      - name: Record source revision
        id: source
        shell: pwsh
        run: |
          $revision = git rev-parse HEAD
          $shortRevision = git rev-parse --short=12 HEAD
          "revision=$revision" >> $env:GITHUB_OUTPUT
          "short_revision=$shortRevision" >> $env:GITHUB_OUTPUT
          "Building upstream revision: $revision"

      - name: Enable Windows development features
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" `
            /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
          git config --global core.longpaths true

      # The upstream packageManager field selects the matching pnpm version.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # setup-node runs in the original D: workspace; build commands run on C:.
      - name: Configure shared pnpm store
        shell: pwsh
        run: |
          pnpm config set --global store-dir C:/pnpm-store
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to configure the shared pnpm store."
          }
          $buildStore = (pnpm store path --silent | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $buildStore) {
            throw "Failed to resolve the build pnpm store."
          }
          Push-Location $env:GITHUB_WORKSPACE
          try {
            $cacheStore = (pnpm store path --silent | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $cacheStore -ne $buildStore) {
              throw "Build and cache pnpm stores differ: $buildStore / $cacheStore"
            }
          } finally {
            Pop-Location
          }
          New-Item -ItemType Directory -Path $buildStore -Force | Out-Null
          Write-Output "Shared pnpm store: $buildStore"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python for native modules
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Configure unsigned Windows packaging
        shell: pwsh
        run: |
          $feedUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:DSH_WINDOWS_FEED_TAG/"
          $example = "apps/desktop/.env.windows.example"
          $configuration = "apps/desktop/.env.windows"
          if (Test-Path $example) {
            $contents = Get-Content -Raw $example
            $contents = $contents -replace '(?m)^DSH_DESKTOP_APP_ID=.*$', `
              'DSH_DESKTOP_APP_ID=io.github.leisteins.deepseekharness'
            Set-Content -Path $configuration -Value $contents -Encoding utf8NoBOM
          }

          # Unsigned community builds use this repository's updater and do not
          # require the official mandatory-update service. Keep signed validation.
          $packageEnvironment = "apps/desktop/scripts/desktop-package-environment.mjs"
          $environmentContents = Get-Content -Raw $packageEnvironment
          $policyValidation = [regex]'(?m)^(\s*)resolveDesktopPolicyEnvironment\(environment\)\s*$'
          if ($policyValidation.Matches($environmentContents).Count -ne 1) {
            throw "Upstream desktop policy validation changed; refusing to apply an unverified patch."
          }
          $environmentContents = $policyValidation.Replace($environmentContents, `
            '${1}if (!options.unsigned) resolveDesktopPolicyEnvironment(environment)', 1)
          Set-Content -Path $packageEnvironment -Value $environmentContents -Encoding utf8NoBOM

          $builderConfig = "apps/desktop/scripts/electron-builder-config.mjs"
          $builderContents = Get-Content -Raw $builderConfig
          # The upstream unsigned variable is declared later, so inspect env here.
          $policyResolution = [regex]'\bconst policy = resolveDesktopPolicyEnvironment\(env\)'
          if ($policyResolution.Matches($builderContents).Count -ne 1) {
            throw "Upstream desktop policy resolution changed; refusing to apply an unverified patch."
          }
          $builderContents = $policyResolution.Replace($builderContents, `
            "const policy = env.DSH_DESKTOP_UNSIGNED === '1' ? undefined : resolveDesktopPolicyEnvironment(env)", 1)
          # Patch only the policy property, preserving upstream version/commit metadata.
          # Accept both the older inline object and the newer multiline object.
          $policyProperty = [regex]'\bdshMandatoryUpdatePolicy\s*:\s*policy\b(?=\s*[,}])'
          $unsignedPolicy = '...(unsigned ? {} : { dshMandatoryUpdatePolicy: policy })'
          if ($policyProperty.Matches($builderContents).Count -ne 1) {
            throw "Upstream desktop metadata layout changed; refusing to build with an unverified policy patch."
          }
          $builderContents = $policyProperty.Replace($builderContents, $unsignedPolicy, 1)

          # Upstream forces the ordinary updater off for --unsigned builds,
          # which leaves the installer without resources/app-update.yml and makes
          # packaged versions unable to detect updates. Point the unsigned build
          # at this repository's rolling feed instead.
          $originalPublish = "publish: update === undefined ? null : [{ provider: 'generic', url: update.publicUrl, channel: 'nightly' }],"
          $updatedPublish = "publish: [{ provider: 'generic', url: '$feedUrl', channel: 'nightly' }],"
          if (-not $builderContents.Contains($originalPublish)) {
            throw "Upstream desktop publish layout changed; refusing to build with an unverified update feed patch."
          }
          $builderContents = $builderContents.Replace($originalPublish, $updatedPublish)
          Set-Content -Path $builderConfig -Value $builderContents -Encoding utf8NoBOM

          Write-Output "Packaged update source: $feedUrl"

      - name: Build unsigned Windows installer
        shell: pwsh
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Verify packaged update source
        shell: pwsh
        run: |
          $outputDirectory = "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts"
          $feedUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:DSH_WINDOWS_FEED_TAG/"

          $feed = Join-Path $outputDirectory "nightly.yml"
          if (-not (Test-Path $feed)) {
            throw "electron-builder produced no nightly.yml; packaged versions would not detect updates."
          }

          $configs = @(Get-ChildItem -Path $outputDirectory -Recurse -Depth 3 -File -Filter "app-update.yml")
          if ($configs.Count -ne 1) {
            throw "Expected exactly one packaged app-update.yml, found $($configs.Count)."
          }
          $config = Get-Content -Raw $configs[0].FullName
          if ($config -notmatch [regex]::Escape($feedUrl)) {
            throw "Packaged update source does not point at $feedUrl."
          }
          if ($config -notmatch 'channel:\s*nightly') {
            throw "Packaged update source is not on the nightly channel."
          }

          Write-Output "--- nightly.yml ---"
          Get-Content $feed
          Write-Output "--- $($configs[0].FullName) ---"
          Get-Content $configs[0].FullName

      - name: Write build information
        env:
          UPSTREAM_RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          UPSTREAM_RELEASE_TITLE: ${{ needs.resolve-release.outputs.title }}
        shell: pwsh
        run: |
          $outputDirectory = "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts"
          @(
            "Upstream repository: https://github.com/deepseek-ai/deepseek-harness"
            "Upstream release: $env:UPSTREAM_RELEASE_TITLE"
            "Upstream tag: $env:UPSTREAM_RELEASE_TAG"
            "Upstream revision: ${{ steps.source.outputs.revision }}"
            "Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            "Update source: https://github.com/${{ github.repository }}/releases/download/${{ env.DSH_WINDOWS_FEED_TAG }}/"
            "Unsigned build: Windows may display a SmartScreen warning."
          ) | Set-Content -Encoding utf8 "$outputDirectory/BUILD-INFO.txt"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-windows-x64-${{ steps.source.outputs.short_revision }}
          path: |
            C:/dsh/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/deepseek-harness-*-win-x64.exe
            C:/dsh/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/deepseek-harness-*-win-x64.exe.blockmap
            C:/dsh/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/deepseek-harness-*-win-x64-unsigned.exe
            C:/dsh/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/deepseek-harness-*-win-x64-unsigned.exe.blockmap
            C:/dsh/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/nightly.yml
            C:/dsh/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/BUILD-INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish installer to repository release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ needs.resolve-release.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_TITLE: ${{ needs.resolve-release.outputs.title }}
        shell: pwsh
        run: |
          $outputDirectory = "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts"
          $installers = @(
            Get-ChildItem -Path $outputDirectory -File |
              Where-Object { $_.Name -match '^deepseek-harness-.+-win-x64(-unsigned)?\.exe$' }
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = @(
              "Automated unsigned Windows x64 build of [DeepSeek Harness $env:RELEASE_TITLE](https://github.com/deepseek-ai/deepseek-harness/releases/tag/$env:RELEASE_TAG)."
              ""
              "Windows may display a Microsoft Defender SmartScreen warning because the installer is unsigned."
            ) -join "`n"
            $arguments = @(
              "release", "create", $env:RELEASE_TAG,
              "--repo", $env:GITHUB_REPOSITORY,
              "--title", $env:RELEASE_TITLE,
              "--notes", $notes
            )
            if ($env:RELEASE_PRERELEASE -eq "true") {
              $arguments += "--prerelease"
            }
            & gh @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create release $env:RELEASE_TAG."
            }
          } else {
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
              --title $env:RELEASE_TITLE `
              "--prerelease=$($env:RELEASE_PRERELEASE)"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to synchronize release metadata for $env:RELEASE_TAG."
            }
          }

          gh release upload $env:RELEASE_TAG $installers[0].FullName `
            --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload installer to release $env:RELEASE_TAG."
          }

      - name: Publish update feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $outputDirectory = "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts"
          $feedTag = $env:DSH_WINDOWS_FEED_TAG
          $installers = @(
            Get-ChildItem -Path $outputDirectory -File |
              Where-Object { $_.Name -match '^deepseek-harness-.+-win-x64(-unsigned)?\.exe$' }
          )
          $blockmaps = @(
            Get-ChildItem -Path $outputDirectory -File |
              Where-Object { $_.Name -match '^deepseek-harness-.+-win-x64(-unsigned)?\.exe\.blockmap$' }
          )
          if ($installers.Count -ne 1 -or $blockmaps.Count -ne 1) {
            throw "Expected one installer and one blockmap, found $($installers.Count) and $($blockmaps.Count)."
          }
          $feedFiles = @(
            (Join-Path $outputDirectory "nightly.yml")
            $installers[0].FullName
            $blockmaps[0].FullName
          )
          $missing = @($feedFiles | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -ne 0) {
            throw "Missing update feed files: $($missing -join ', ')."
          }

          # The updater resolves the installer and blockmap relative to
          # nightly.yml, so all three assets must live in one release.
          gh release view $feedTag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = @(
              "Machine-managed update feed for the unsigned Windows x64 builds."
              ""
              "Installed applications read ``nightly.yml`` (and the installer and blockmap it references) from this release through the update source baked into their installer. Assets are replaced on every build; do not delete them."
            ) -join "`n"
            gh release create $feedTag `
              --repo $env:GITHUB_REPOSITORY `
              --title "Windows update feed" `
              --notes $notes `
              --prerelease
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create the update feed release $feedTag."
            }
          }

          # Publish the payload before switching the manifest to the new version.
          gh release upload $feedTag $installers[0].FullName $blockmaps[0].FullName `
            --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload the update payload to $feedTag."
          }
          gh release upload $feedTag $feedFiles[0] --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload the update feed to $feedTag."
          }

          # Only prune old Windows payloads after the new feed is published.
          # Versioned releases remain available for historical downloads.
          $releaseId = gh release view $feedTag --repo $env:GITHUB_REPOSITORY --json databaseId --jq '.databaseId'
          if ($LASTEXITCODE -ne 0 -or -not $releaseId) {
            throw "Failed to resolve the update feed release ID."
          }
          $assetJson = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets?per_page=100"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to list update feed assets."
          }
          $currentNames = @($installers[0].Name, $blockmaps[0].Name)
          $assetPages = ($assetJson -join "`n") | ConvertFrom-Json
          foreach ($page in $assetPages) {
            foreach ($asset in $page) {
              if ($asset.name -match '^deepseek-harness-.+-win-x64(-unsigned)?\.exe(\.blockmap)?$' -and
                  $asset.name -notin $currentNames) {
                gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)"
                if ($LASTEXITCODE -ne 0) {
                  throw "Failed to delete old update feed asset $($asset.name)."
                }
                Write-Output "Deleted old update feed asset: $($asset.name)"
              }
            }
          }

          Write-Output "Update feed published to https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$feedTag"
