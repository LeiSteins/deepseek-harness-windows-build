name: Build DeepSeek Harness for Windows

on:
  workflow_dispatch:
  schedule:
    # 00:00 Asia/Shanghai (16:00 UTC on the previous calendar day).
    - cron: "0 16 * * *"

permissions:
  contents: write

concurrency:
  group: windows-desktop-release
  cancel-in-progress: false

env:
  DSH_DESKTOP_APP_ID: io.github.leisteins.deepseekharness
  DSH_TELEMETRY_DISABLED: "1"

jobs:
  resolve-release:
    name: Resolve latest upstream release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      should_build: ${{ steps.release.outputs.should_build }}
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}

    steps:
      - name: Find latest DeepSeek Harness release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_json="$(gh api 'repos/deepseek-ai/deepseek-harness/releases?per_page=100')"
          tag="$(jq -r 'map(select(.draft == false))[0].tag_name // empty' <<< "$release_json")"
          title="$(jq -r 'map(select(.draft == false))[0].name // empty' <<< "$release_json")"
          prerelease="$(jq -r 'map(select(.draft == false))[0].prerelease' <<< "$release_json")"

          if [[ -z "$tag" ]]; then
            echo "No published upstream release was found." >&2
            exit 1
          fi
          if [[ -z "$title" ]]; then
            title="$tag"
          fi

          release_complete=false
          if local_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null)"; then
            if jq -e '.assets | any(.name; test("^deepseek-harness-.+-win-x64\\.exe$"))' \
              <<< "$local_release" >/dev/null; then
              release_complete=true
            fi
          fi

          should_build=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$release_complete" == "false" ]]; then
            should_build=true
          fi

          {
            echo "tag=$tag"
            echo "title=$title"
            echo "prerelease=$prerelease"
            echo "should_build=$should_build"
          } >> "$GITHUB_OUTPUT"

          echo "Latest upstream release: $title ($tag)"
          echo "Matching local release has an installer: $release_complete"
          echo "Build requested: $should_build"

  build:
    name: Windows x64 unsigned installer
    needs: resolve-release
    if: needs.resolve-release.outputs.should_build == 'true'
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - name: Check out DeepSeek Harness
        uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.resolve-release.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record source revision
        id: source
        shell: pwsh
        run: |
          $revision = git rev-parse HEAD
          $shortRevision = git rev-parse --short=12 HEAD
          "revision=$revision" >> $env:GITHUB_OUTPUT
          "short_revision=$shortRevision" >> $env:GITHUB_OUTPUT
          "Building upstream revision: $revision"

      - name: Enable Windows development features
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" `
            /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
          git config --global core.longpaths true

      # The upstream packageManager field selects the matching pnpm version.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python for native modules
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Configure unsigned Windows packaging
        shell: pwsh
        run: |
          $example = "apps/desktop/.env.windows.example"
          $configuration = "apps/desktop/.env.windows"
          if (Test-Path $example) {
            $contents = Get-Content -Raw $example
            $contents = $contents -replace '(?m)^DSH_DESKTOP_APP_ID=.*$', `
              'DSH_DESKTOP_APP_ID=io.github.leisteins.deepseekharness'
            Set-Content -Path $configuration -Value $contents -Encoding utf8NoBOM
          }

          # Unsigned community builds have no packaged updater. Keep the
          # environment required by upstream packaging validation, but do not
          # embed its mandatory test-update policy in the installed app.
          $builderConfig = "apps/desktop/scripts/electron-builder-config.mjs"
          $builderContents = Get-Content -Raw $builderConfig
          $originalMetadata = 'extraMetadata: { dshDesktopAppId: appId, dshMandatoryUpdatePolicy: policy },'
          $unsignedMetadata = 'extraMetadata: { dshDesktopAppId: appId, ...(unsigned ? {} : { dshMandatoryUpdatePolicy: policy }) },'
          if (-not $builderContents.Contains($originalMetadata)) {
            throw "Upstream desktop metadata layout changed; refusing to build with an unverified policy patch."
          }
          $builderContents = $builderContents.Replace($originalMetadata, $unsignedMetadata)
          Set-Content -Path $builderConfig -Value $builderContents -Encoding utf8NoBOM

      - name: Build unsigned Windows installer
        shell: pwsh
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Write build information
        env:
          UPSTREAM_RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          UPSTREAM_RELEASE_TITLE: ${{ needs.resolve-release.outputs.title }}
        shell: pwsh
        run: |
          $outputDirectory = "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts"
          @(
            "Upstream repository: https://github.com/deepseek-ai/deepseek-harness"
            "Upstream release: $env:UPSTREAM_RELEASE_TITLE"
            "Upstream tag: $env:UPSTREAM_RELEASE_TAG"
            "Upstream revision: ${{ steps.source.outputs.revision }}"
            "Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            "Unsigned build: Windows may display a SmartScreen warning."
          ) | Set-Content -Encoding utf8 "$outputDirectory/BUILD-INFO.txt"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-windows-x64-${{ steps.source.outputs.short_revision }}
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/deepseek-harness-*-win-x64.exe
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/deepseek-harness-*-win-x64.exe.blockmap
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/BUILD-INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish installer to repository release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ needs.resolve-release.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_TITLE: ${{ needs.resolve-release.outputs.title }}
        shell: pwsh
        run: |
          $outputDirectory = "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts"
          $installers = @(
            Get-ChildItem -Path $outputDirectory -File |
              Where-Object { $_.Name -match '^deepseek-harness-.+-win-x64\.exe$' }
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = @(
              "Automated unsigned Windows x64 build of [DeepSeek Harness $env:RELEASE_TITLE](https://github.com/deepseek-ai/deepseek-harness/releases/tag/$env:RELEASE_TAG)."
              ""
              "Windows may display a Microsoft Defender SmartScreen warning because the installer is unsigned."
            ) -join "`n"
            $arguments = @(
              "release", "create", $env:RELEASE_TAG,
              "--repo", $env:GITHUB_REPOSITORY,
              "--title", $env:RELEASE_TITLE,
              "--notes", $notes
            )
            if ($env:RELEASE_PRERELEASE -eq "true") {
              $arguments += "--prerelease"
            }
            & gh @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create release $env:RELEASE_TAG."
            }
          } else {
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
              --title $env:RELEASE_TITLE `
              "--prerelease=$($env:RELEASE_PRERELEASE)"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to synchronize release metadata for $env:RELEASE_TAG."
            }
          }

          gh release upload $env:RELEASE_TAG $installers[0].FullName `
            --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload installer to release $env:RELEASE_TAG."
          }
